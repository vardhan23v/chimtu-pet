name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest pillow
      - run: pytest -q tests
      - name: Renderers run
        run: |
          python tools/render_sprites.py /tmp/frames shiba >/dev/null
          python tools/render_sounds.py /tmp/sounds >/dev/null

  windows:
    runs-on: windows-latest
    needs: test-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install --quiet pillow pyinstaller
      - name: Render assets
        run: |
          python tools/render_sprites.py Resources/frames/shiba shiba
          python tools/render_sprites.py Resources/frames/cream cream
          python tools/render_sounds.py Resources/sounds
      - name: Build Chimtu.exe
        run: pyinstaller --noconfirm --onefile --windowed --name Chimtu --icon Resources/Chimtu.ico --add-data "Resources/frames;frames" --add-data "Resources/sounds;sounds" --paths windows windows/chimtu.py
      - name: Zip
        run: Compress-Archive -Path dist/Chimtu.exe -DestinationPath Chimtu-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Chimtu-Windows
          path: Chimtu-Windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Chimtu-Windows.zip

  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags + commit count for the version number
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow (sprite renderer)
        run: python -m pip install --quiet pillow
      - name: Core checks
        run: swift run -c release ChimtuCoreChecks
      - name: Import signing certificate
        if: env.APPLE_CERT_P12 != ''
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          echo "SIGN_IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -1 | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_ENV"
      - name: Build Chimtu.app
        run: PYTHON=python ./build.sh
      - name: Verify universal
        run: lipo -archs dist/Chimtu.app/Contents/MacOS/Chimtu | grep -q x86_64 && lipo -archs dist/Chimtu.app/Contents/MacOS/Chimtu | grep -q arm64
      - name: Notarize
        if: env.SIGN_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent dist/Chimtu.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Chimtu.app
      - name: Zip
        run: cd dist && zip -qry ../Chimtu-macOS.zip Chimtu.app
      - name: Size gate (< 6 MB)
        run: test $(stat -f%z Chimtu-macOS.zip) -lt 6291456
      - uses: actions/upload-artifact@v4
        with:
          name: Chimtu-macOS
          path: Chimtu-macOS.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Chimtu-macOS.zip
          generate_release_notes: true
