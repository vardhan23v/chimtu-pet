name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow (sprite renderer)
        run: python -m pip install --quiet pillow
      - name: Build Chimtu.app
        run: PYTHON=python ./build.sh
      - name: Zip
        run: cd dist && zip -qry ../Chimtu.zip Chimtu.app
      - uses: actions/upload-artifact@v4
        with:
          name: Chimtu
          path: Chimtu.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Chimtu.zip
          generate_release_notes: true
